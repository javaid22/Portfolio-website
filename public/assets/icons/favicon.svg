<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAD32" />
      <stop offset="100%" stop-color="#F39217" />
    </linearGradient>
    <filter id="jhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFAD32" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="#0D1521" stroke="#293747" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#FFAD32" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- JH Modern Architectural Monogram -->
  <g transform="translate(10, 10)">
    <!-- J Element (Amber) -->
    <path d="M 12 6 L 18 6 L 18 26 C 18 31 14 34 8 34 C 4 34 1 32 0 30 L 3 25 C 4.5 26.5 6.2 27.5 8.5 27.5 C 11 27.5 12 26 12 24 Z" 
          fill="url(#jhGrad)" filter="url(#jhGlow)"/>
    
    <!-- H Right Column (White/Clean Gray) -->
    <path d="M 32 6 L 38 6 L 38 34 L 32 34 Z" fill="#F4F6FA"/>
    
    <!-- H Horizontal Bar & Bridge connecting J and H -->
    <rect x="18" y="17" width="14" height="6" fill="url(#jhGrad)" rx="1"/>
    
    <!-- Code Dot Accent -->
    <circle cx="25" cy="9" r="2.5" fill="#FFAD32"/>
  </g>
</svg>
